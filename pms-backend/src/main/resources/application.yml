spring:
  application:
    name: pms-backend
  datasource:
    url: ${PMS_DB_URL:jdbc:postgresql://localhost:5432/pms}
    username: ${PMS_DB_USER:postgres}
    password: ${PMS_DB_PASSWORD:postgres}
    hikari:
      maximum-pool-size: 10
      pool-name: pms-pool
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false

server:
  port: ${PMS_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when_authorized

logging:
  level:
    org.flywaydb: info
