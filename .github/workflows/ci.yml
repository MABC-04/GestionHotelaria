name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Modelo y backend (Java 21 + PostgreSQL 16)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      PMS_TEST_DB_URL: jdbc:postgresql://localhost:5432/postgres
      PMS_DB_USER: postgres
      PMS_DB_PASSWORD: postgres

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: mvn verify (modelo, generador, backend e IT)
        run: ./mvnw -B verify

      - name: La matriz de trazabilidad está al día
        run: git diff --exit-code -- pms-docs/trazabilidad.md

      - name: Publicar la matriz
        uses: actions/upload-artifact@v4
        with:
          name: trazabilidad
          path: pms-docs/trazabilidad.md
          if-no-files-found: error

  frontend:
    name: Frontend (Angular 22)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: pms-frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: pms-frontend/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: Pruebas
        run: npx ng test --watch=false

      - name: Build de producción
        run: npm run build
